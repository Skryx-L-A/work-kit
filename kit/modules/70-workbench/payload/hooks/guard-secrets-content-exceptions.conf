# bash-guard-secrets: Ausnahmen fuer die INHALTS-Pruefung (Abschnitt 3).
#
# Diese Datei betrifft NUR die Inhaltspruefung (Muster + Entropie in
# Dateiinhalten). Die Pfad-/Dateinamen-Pruefung (is_secret_path, inklusive
# der Ausnahme fuer 90-secrets/) ist davon unabhaengig, steht im Skript
# selbst und bleibt unveraendert.
#
# Eine Zeile = ein Glob-Muster gegen den repo-relativen Pfad (case-sensitive,
# `*` matcht auch `/`). Leere Zeilen und Zeilen mit '#' werden ignoriert.
# Fehlt diese Datei, gilt der sichere Standard: KEINE Ausnahme (es wird
# mehr gescannt, nie weniger).
#
# Vorsicht bei eigenen Ergaenzungen: eine Ausnahme hier bedeutet, dass ein
# echtes Secret in einer passenden Datei UNBEMERKT durchgeht. Nur fuer
# Dateien eintragen, deren Inhalt grundsaetzlich keine echten Zugangsdaten
# enthalten kann (Dokumentation, Lockfiles, generierter/minifizierter Code,
# reine Platzhalter-Beispieldateien).

*.md
*.lock
*.min.js
*.svg
*.example
*.sample
*.template
