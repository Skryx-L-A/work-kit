name=Omarchy-like desktop
description=GNOME with tiling, Omarchy keybindings, themes, Ghostty, Nerd Font and dev TUIs (log out/in after install)
depends=
group=
needs_sudo=no
default_on=no
offline=desktop/
check={ command -v kit-desk >/dev/null && test -f "${KIT_DATA_DIR:-$HOME/.local/share/work-kit}/desktop/state/install.conf"; } || bash install.sh --unsupported >/dev/null 2>&1
