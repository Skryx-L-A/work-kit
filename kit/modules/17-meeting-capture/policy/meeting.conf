# meeting.conf: settings for the `meeting` CLI (key=value, one per line). Environment
# variables MEETING_<KEY> (for example MEETING_STORE) override this file.

# Where the note goes: auto (brain if `brain` exists, else meetings_dir), brain, files.
#store=auto
# Put the transcript into the brain note (yes) or into a separate file in meetings_dir (no).
#transcript_in_brain=yes
#meetings_dir=~/work/meetings
# Brain project slug for the notes.
#project=
# Whisper language code (de, en, ...); default: automatic detection.
#language=
# Speech server. Default: the 80-quassel server, started on demand. Must be on this machine.
#whisper_url=http://127.0.0.1:8765
# Local model for `meeting stop --summarize` (OpenAI-compatible, for example 15-local-llm).
#summary_url=http://127.0.0.1:8080/v1
#summary_model=
# Days after which `meeting purge` deletes old audio and old notes in meetings_dir.
# The value is set by the retention rule in meeting-ai-policy.md: TODO(ask IT).
#retention_days=
