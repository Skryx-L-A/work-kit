# 01-prereqs items. One line per item:
#   id | default | user path | apt packages | commands | description
# default   yes = installed when install.sh gets no item list
# user path how the no-sudo path provides the item:
#   vscode     official portable tar.gz, `code` wrapper, desktop entry
#   cpython    standalone CPython from kit/offline/python (00-python build output)
#   node       official Node.js tar.xz (files.lock); the sudo path uses it as well
#   deb        unpack the .debs the system lacks under ~/.local/share, wrappers set LD_LIBRARY_PATH
#   ldso       like deb, but the wrapper passes the library path to the loader only, so child
#              processes (tmux panes) do not inherit it
#   toolchain  like deb plus a private sysroot with the whole closure (gcc --sysroot); experimental
#   none       no no-sudo path; sudo path only
# apt packages  roots of the dependency closure for the offline apt repository (sudo path)
# commands      programs that get a wrapper in ~/.local/bin (no-sudo path)
vscode          | yes | vscode    | code                        | code                               | Visual Studio Code
git             | yes | deb       | git                         | git git-shell git-upload-pack git-receive-pack git-upload-archive | Git
tmux            | yes | ldso      | tmux                        | tmux                               | terminal multiplexer (needed by 70-workbench, 71-delegate)
curl            | yes | deb       | curl                        | curl                               | curl
python3         | yes | cpython   | python3 python3-venv        | python3                            | Python 3 with venv (kit/install needs python3)
whiptail        | yes | deb       | whiptail                    | whiptail                           | menus for kit/install
jq              | no  | deb       | jq                          | jq                                 | jq (10-base-tools ships a static jq as well)
sqlite3         | no  | deb       | sqlite3                     | sqlite3                            | SQLite shell
zip             | no  | deb       | zip unzip                   | zip unzip zipinfo funzip           | zip and unzip
rsync           | no  | deb       | rsync                       | rsync                              | rsync
ssh             | yes | deb       | openssh-client              | ssh scp sftp ssh-keygen ssh-add ssh-agent ssh-keyscan | OpenSSH client
clipboard       | no  | deb       | xclip wl-clipboard          | xclip wl-copy wl-paste             | clipboard tools for X11 and Wayland
audio           | no  | deb       | pulseaudio-utils pipewire-bin | parecord pactl pw-record         | recording tools (80-quassel dictation, meeting capture)
lsof            | no  | deb       | lsof                        | lsof                               | lsof (70-workbench)
graphviz        | no  | deb       | graphviz                    | dot                                | Graphviz dot (12-docs-tools, dependency graphs)
zsh             | no  | none      | zsh                         |                                    | zsh (70-workbench VS Code extension calls /bin/zsh)
node            | no  | node      |                             | node npm npx corepack              | Node.js LTS (harness CLIs, VS Code extension builds)
build-essential | no  | toolchain | build-essential             | gcc g++ cc c++ cpp make            | C/C++ compiler and make
make            | no  | deb       | make                        | make                               | make only
shellcheck      | no  | deb       | shellcheck                  | shellcheck                         | shell script linter (10-base-tools apt.sh lists it)
chrome          | no  | none      | google-chrome-stable        |                                    | Google Chrome (Teams in the browser)
edge            | no  | none      | microsoft-edge-stable       |                                    | Microsoft Edge (Teams in the browser)
